name: faultgate
description: Gate a deploy on recorded agent traces — rule checks, optional band, golden answers and policy. Exit 1 on FAIL. Set baseline + candidate to compare two models instead; exit 1 on BLOCK.
branding: { icon: shield, color: red }
inputs:
  traces:  { description: "check mode: trace export to check (OTLP/JSON, OpenInference, Langfuse, LangSmith or Braintrust); needed in check mode", required: false, default: "" }
  baseline: { description: "compare mode: baseline run files, whitespace/newline separated, each word may be a shell glob (base/run*.json)", required: false, default: "" }
  candidate: { description: "compare mode: candidate run files, same rules as baseline; set this to run compare instead of check", required: false, default: "" }
  budget:  { description: "compare mode: budget.json (what counts as no real change, per dimension)", required: false, default: "" }
  prices:  { description: "compare mode: prices.json (per-model token or GPU-hour prices)", required: false, default: "" }
  seed:    { description: "compare mode: bootstrap seed", required: false, default: "0" }
  resamples: { description: "compare mode: bootstrap resamples (>= 200)", required: false, default: "2000" }
  strict:  { description: "compare mode: \"true\" fails the job on REVIEW as well as BLOCK", required: false, default: "false" }
  band:    { description: "band.json from `faultgate baseline` (FAIL only outside the measured band)", required: false, default: "" }
  golden:  { description: "golden.json of expected answers", required: false, default: "" }
  policy:  { description: "policy.json of allowed tools / patterns / budgets / limits / identity / prerequisites", required: false, default: "" }
  outcomes: { description: "outcomes.json of {scenario key: true | false} from your own evaluator (adds the outcome check)", required: false, default: "" }
  checks:  { description: "comma-separated subset of checks", required: false, default: "" }
  judge:   { description: "laya or litellm:<model>; needs the [laya] / [api] extra installed", required: false, default: "" }
  format:  { description: "trace format (default: detect)", required: false, default: "auto" }
  redact:  { description: "builtin | presidio | off — masking of PII and secrets in judge input and reasons", required: false, default: "builtin" }
  report:  { description: "path to write the JSON report", required: false, default: "faultgate-report.json" }
  audit:   { description: "directory for verdict.json, failing_traces.json and repro.sh (uploaded as an artifact)", required: false, default: "faultgate-audit" }
  comment: { description: "on pull requests, post or update one summary comment (needs pull-requests: write)", required: false, default: "true" }
  version: { description: "faultgate to install: a version (0.3.0), a pip specifier (>=0.3), a full requirement (faultgate==0.3.0), or a path/VCS spec for pip", required: false, default: "faultgate" }
outputs:
  verdict: { description: "PASS, FAIL or INCONCLUSIVE (check); SHIP, REVIEW or BLOCK (compare)", value: "${{ steps.gate.outputs.verdict }}" }
# Inputs reach the shell only as environment variables, never spliced into script text.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # a bare version or specifier names faultgate's version; anything else goes to pip as written
        case "$VERSION" in
          [0-9]*)                       spec="faultgate==$VERSION" ;;
          v[0-9]*)                      spec="faultgate==${VERSION#v}" ;;
          "=="*|">"*|"<"*|"~="*|"!="*)  spec="faultgate$VERSION" ;;
          *)                            spec="$VERSION" ;;
        esac
        pip install --quiet "$spec"
    - id: gate
      shell: bash
      env:
        TRACES: ${{ inputs.traces }}
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        BUDGET: ${{ inputs.budget }}
        PRICES: ${{ inputs.prices }}
        SEED: ${{ inputs.seed }}
        RESAMPLES: ${{ inputs.resamples }}
        STRICT: ${{ inputs.strict }}
        REPORT: ${{ inputs.report }}
        AUDIT: ${{ inputs.audit }}
        FORMAT: ${{ inputs.format }}
        REDACT: ${{ inputs.redact }}
        BAND: ${{ inputs.band }}
        GOLDEN: ${{ inputs.golden }}
        POLICY: ${{ inputs.policy }}
        OUTCOMES: ${{ inputs.outcomes }}
        CHECKS: ${{ inputs.checks }}
        JUDGE: ${{ inputs.judge }}
      run: |
        md="$RUNNER_TEMP/faultgate-summary.md"
        # exactly one mode: traces (check) or baseline + candidate (compare)
        msg=""
        if [ -n "$TRACES" ] && [ -n "$CANDIDATE" ]; then
          msg="set traces (check) or baseline + candidate (compare), not both"
        elif [ -z "$TRACES" ] && [ -z "$CANDIDATE" ]; then
          msg="set traces (check) or baseline + candidate (compare)"
        elif [ -n "$CANDIDATE" ] && [ -z "$BASELINE" ]; then
          msg="compare mode needs baseline as well as candidate"
        fi
        if [ -n "$msg" ]; then
          echo "::error::faultgate: $msg"
          echo "code=2" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$CANDIDATE" ]; then
          # each input word may be a glob; bash expands it in sorted order, and a pattern that matches nothing
          # is passed as written, so faultgate exits 2 with "no such file".
          # ponytail: words are split on whitespace, so a path with a space cannot be expressed.
          # upgrade: a newline-separated list read with `mapfile -t` from a file input.
          args=(compare --baseline)
          files=( $BASELINE );  args+=("${files[@]}" --candidate)
          files=( $CANDIDATE ); args+=("${files[@]}" --json "$REPORT" --markdown "$md" --format "$FORMAT" --redact "$REDACT"
                                       --seed "$SEED" --resamples "$RESAMPLES")
          [ "$STRICT" = true ] && args+=(--strict)
          [ -n "$BUDGET" ] && args+=(--budget "$BUDGET")
          [ -n "$PRICES" ] && args+=(--prices "$PRICES")
        else
          args=(check "$TRACES" --json "$REPORT" --markdown "$md" --format "$FORMAT" --redact "$REDACT")
          [ -n "$BAND" ]   && args+=(--band "$BAND")
        fi
        [ -n "$AUDIT" ]  && args+=(--audit "$AUDIT")
        [ -n "$GOLDEN" ] && args+=(--golden "$GOLDEN")
        [ -n "$POLICY" ] && args+=(--policy "$POLICY")
        [ -n "$OUTCOMES" ] && args+=(--outcomes "$OUTCOMES")
        [ -n "$CHECKS" ] && args+=(--check "$CHECKS")
        [ -n "$JUDGE" ]  && args+=(--judge "$JUDGE")
        set +e
        faultgate "${args[@]}"
        code=$?
        set -e
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$md" ]; then
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$(sed -n 's/^## faultgate\( compare\)\{0,1\}: //p' "$md" | head -1)" >> "$GITHUB_OUTPUT"
          echo "summary=$md" >> "$GITHUB_OUTPUT"
        fi
    - if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.gate.outputs.summary != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        MD: ${{ steps.gate.outputs.summary }}
      run: |
        # one comment per PR, found by its <!-- faultgate --> marker and updated in place.
        # A comment is a convenience: any API failure (e.g. a fork's read-only token) warns, never fails the job.
        warn() { echo "::warning::faultgate could not comment on the PR ($1); give the job pull-requests: write"; exit 0; }
        if ! id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- faultgate -->")) | .id'); then
          warn "listing comments failed"
        fi
        id=$(printf '%s\n' "$id" | head -1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$MD" > /dev/null || warn "update failed"
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$MD" > /dev/null || warn "create failed"
        fi
    - if: ${{ always() && inputs.audit != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: faultgate-audit
        path: ${{ inputs.audit }}
        if-no-files-found: ignore
        overwrite: true
    - shell: bash
      env:
        CODE: ${{ steps.gate.outputs.code }}
      run: |
        # no recorded code means the gate did not run: fail closed
        exit "${CODE:-2}"
